<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio dan Video></title>
  </head>
  <body>
    <h3>Video Playlist</h3>
    <video controls poster="media/logo.jpg" width="300">
      <source type="video/mp4" src="media/video.mp4" />
      <source type="video/webm" src="media/videowebm.webm" />
      Browser tidak support play video
    </video>
    <hr />
    <h3>MP3 Playlist</h3>
    <audio controls>
      <source src="media/lagu.mp3" />
    </audio>
  </body>
</html>
